name: continuo_finance
version: '1.0.1'
config-version: 2
profile: default

model-paths: ["models"]
seed-paths: ["seeds"]

seeds:
  continuo_finance:
    # A seed is a full snapshot of its CSV, not an append/incremental target,
    # so it should always be rebuilt from scratch -- see services/continuo-core/dbt_project.yml
    # for why +full_refresh: false is the wrong default (it silently blocks
    # any future column change from landing).
    +full_refresh: true
    +meta:
      owner: "finance"
      criticality: "CORE"
    # marketing_cost_per_user is a frozen input from the marketing team, carried
    # as a seed so this two-team demo runs without a marketing service. Pin its
    # types so the CSV's user_id joins revenue_per_user (int) and marketing_cost_eur
    # stays numeric for the LTV math, rather than dbt's inferred defaults.
    marketing_cost_per_user:
      +column_types:
        user_id: integer
        channel: varchar
        marketing_cost_eur: numeric

models:
  continuo_finance:
    +materialized: table
    +meta:
      owner: "finance"
      criticality: "CORE"
